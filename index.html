<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F8F2EE"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>莉芸家預算</title></head><body><div class="app"><header><div><h1>莉芸家預算</h1><small>家庭財務導航</small></div><div class="month"><button id="prev">‹</button><b id="month">2026/9</b><button id="next">›</button></div></header><main><section id="budget" class="view active"><div class="tabs"><button>個人</button><button>公費</button><button class="active">家庭</button></div><div class="steps"><div><span>1</span><b>收入</b><small id="sIncome">$110,000</small></div><div><span>2</span><b>看建議</b><small id="sRemain">$6,410</small></div><div class="now"><span>3</span><b>分配</b><small id="sFixed">$103,590</small></div><div><span>4</span><b>完成</b><small id="sDone">待分配 $6,410</small></div></div><details class="card"><summary>步驟 1｜盤點收入總額 <b id="incomeTotal">$110,000</b></summary><div class="body"><label>先生薪資<input id="husband" type="number" value="67000"></label><label>太太薪資<input id="wife" type="number" value="35000"></label><label>其他收入／補貼<input id="other" type="number" value="8000"></label></div></details><details class="card"><summary>步驟 2｜看分配建議 <b id="remainSummary">建議預留 $6,410</b></summary><div class="body note">先保留固定支出，剩餘金額做為本月機動預算；快速記帳後會即時扣除。</div></details><details class="card" open><summary>步驟 3｜你想怎麼分配 <b id="fixedTotal">$103,590</b></summary><div class="body"><div id="expenses" class="grid"></div><button id="addExpense" class="soft">＋ 新增固定支出</button></div></details><details class="card"><summary>步驟 4｜完成 <b id="doneSummary">待分配 $6,410</b></summary><div class="body">確認後就把目前設定當作本月預算基準。</div></details><div class="sticky"><div><small>待分配</small><strong id="remainBig">$6,410</strong></div><button id="finish">完成本月預算</button></div></section><section id="quick" class="view"><div class="panel"><h2>快速記帳</h2><label>金額<input id="qAmount" type="number" placeholder="0"></label><label>分類<select id="qCategory"><option>餐飲</option><option>購物</option><option>交通</option><option>小孩</option><option>生活</option><option>醫療</option><option>其他</option></select></label><label>付款方式<select id="qMethod"><option>現金</option><option>信用卡</option><option>轉帳</option></select></label><label>備註<input id="qNote" placeholder="例如：午餐"></label><button id="saveQ">儲存這筆</button></div><div class="panel"><h3>本月記帳 <span id="spent">$0</span></h3><div id="ledger"></div></div></section><section id="diag" class="view"><div class="panel"><h2>本月診斷</h2><div class="stats"><div>家庭收入<b id="dIncome"></b></div><div>固定支出<b id="dFixed"></b></div><div>機動支出<b id="dSpent"></b></div><div>目前可用<b id="dAvail"></b></div></div><div id="diagMsg" class="note"></div></div></section><section id="news" class="view"><div class="panel"><h2>快訊</h2><div id="newsList"></div></div></section><section id="more" class="view"><div class="panel"><h2>更多</h2><button id="export" class="soft">匯出本月備份 JSON</button><button id="reset" class="danger">重設本月資料</button><p class="hint">第一版資料存在這台裝置的瀏覽器，不需要登入。</p></div></section></main><nav><button data-v="news">📣<small>快訊</small></button><button data-v="budget" class="active">👛<small>預算</small></button><button data-v="quick" class="plus">＋<small>快速記帳</small></button><button data-v="diag">▥<small>診斷</small></button><button data-v="more">•••<small>更多</small></button></nav></div><dialog id="dlg"><form method="dialog"><h3>新增固定支出</h3><label>名稱<input id="eName"></label><label>金額<input id="eAmount" type="number"></label><div class="actions"><button value="cancel" class="soft">取消</button><button id="eSave" value="default">新增</button></div></form></dialog><script src="./app.js"></script></body></html>
